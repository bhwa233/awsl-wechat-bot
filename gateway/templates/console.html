<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AWSL Console</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #efefe9;
            --paper: #fbfaf6;
            --panel: #ffffff;
            --rail: #f3f2ed;
            --ink: #20231f;
            --muted: #74786f;
            --quiet: #9a9d95;
            --line: #dedbd1;
            --line-strong: #c9c4b8;
            --green: #1f9d55;
            --green-dark: #12713c;
            --green-soft: #e7f5eb;
            --amber: #c47b24;
            --red: #b42318;
            --bubble-other: #ffffff;
            --bubble-self: #9eea73;
            --shadow: 0 18px 50px rgba(44, 42, 34, .10);
        }

        * { box-sizing: border-box; }
        html,
        body {
            height: 100%;
            overflow: hidden;
        }
        body {
            margin: 0;
            background:
                linear-gradient(90deg, rgba(32,35,31,.04) 1px, transparent 1px),
                linear-gradient(180deg, rgba(32,35,31,.04) 1px, transparent 1px),
                var(--bg);
            background-size: 24px 24px;
            color: var(--ink);
            font: 14px/1.45 "Avenir Next", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        button,
        input,
        textarea {
            font: inherit;
        }
        button {
            -webkit-tap-highlight-color: transparent;
        }
        .shell {
            height: 100vh;
            padding: 14px;
            display: grid;
            grid-template-rows: minmax(0, 1fr);
            overflow: hidden;
        }
        .grid {
            display: grid;
            grid-template-columns: 356px minmax(0, 1fr);
            gap: 12px;
            height: 100%;
            min-height: 0;
        }
        .panel {
            min-height: 0;
            background: rgba(255,255,255,.92);
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-head {
            min-height: 58px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(180deg, #fff, var(--paper));
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
        }
        .chat-panel .panel-head {
            grid-template-columns: auto minmax(0, 1fr) auto;
        }
        .head-main {
            min-width: 0;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .panel-title {
            min-width: 0;
            font-size: 15px;
            font-weight: 760;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .count {
            flex: none;
            min-width: 24px;
            padding: 1px 7px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--rail);
            color: var(--muted);
            font-size: 11px;
            text-align: center;
        }
        .status {
            position: relative;
            min-width: 0;
            padding-left: 14px;
            color: var(--muted);
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .status::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            transform: translateY(-50%);
            box-shadow: 0 0 0 3px rgba(31,157,85,.12);
        }
        .status.loading::before {
            animation: statusPulse 1s ease-in-out infinite;
        }
        .status.error::before {
            background: var(--red);
            box-shadow: 0 0 0 3px rgba(180,35,24,.12);
        }
        .panel-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 7px;
            min-width: 0;
        }
        .mobile-back {
            display: none;
        }
        .btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 74px;
            min-height: 34px;
            padding: 7px 12px;
            border: 1px solid var(--green-dark);
            border-radius: 8px;
            background: var(--green);
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            font-weight: 680;
            transition: transform .12s ease, border-color .12s ease, background .12s ease, opacity .12s ease;
        }
        .btn:hover {
            background: var(--green-dark);
        }
        .btn:focus-visible,
        .chat-row:focus-visible,
        .compose textarea:focus-visible,
        .token:focus-visible {
            outline: 2px solid rgba(31,157,85,.38);
            outline-offset: 2px;
        }
        .btn:active {
            transform: translateY(1px);
        }
        .btn.secondary {
            border-color: var(--line-strong);
            background: #fff;
            color: var(--ink);
        }
        .btn.secondary:hover {
            border-color: var(--green);
            background: var(--green-soft);
        }
        .btn:disabled {
            cursor: not-allowed;
            opacity: .55;
        }
        .btn.loading {
            color: transparent;
            pointer-events: none;
        }
        .btn.loading svg {
            opacity: 0;
        }
        .btn.loading::after {
            content: "";
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,.95);
            border-right-color: transparent;
            animation: spin .72s linear infinite;
        }
        .btn.secondary.loading::after {
            border-color: rgba(32,35,31,.72);
            border-right-color: transparent;
        }
        .icon-btn {
            min-width: 36px;
            width: 36px;
            padding: 0;
        }
        .icon-btn svg {
            width: 16px;
            height: 16px;
            stroke-width: 2.2;
        }
        .send-btn {
            min-width: 86px;
        }
        .send-btn svg {
            width: 15px;
            height: 15px;
            stroke-width: 2.3;
        }
        .panel-body {
            flex: 1;
            min-height: 0;
            overflow: auto;
        }
        .list-panel .panel-body {
            padding: 8px;
            background: var(--rail);
        }
        .chat-panel .panel-body {
            padding: 18px 18px 14px;
            background:
                linear-gradient(180deg, rgba(255,255,255,.74), rgba(239,239,233,.86)),
                var(--paper);
        }
        .chat-row {
            position: relative;
            width: 100%;
            min-height: 70px;
            text-align: left;
            padding: 10px 10px 10px 12px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            display: grid;
            grid-template-columns: 36px minmax(0, 1fr);
            align-items: center;
            gap: 9px;
        }
        .chat-row::before {
            content: "";
            position: absolute;
            left: 0;
            top: 12px;
            bottom: 12px;
            width: 3px;
            border-radius: 999px;
            background: transparent;
        }
        .chat-row + .chat-row {
            margin-top: 3px;
        }
        .chat-row:hover {
            background: rgba(255,255,255,.7);
            border-color: var(--line);
        }
        .chat-row:disabled {
            cursor: wait;
            opacity: .58;
        }
        .chat-row.active {
            background: #fff;
            border-color: #b9dfc7;
            box-shadow: 0 8px 18px rgba(32, 157, 85, .10);
        }
        .chat-row.active::before {
            background: var(--green);
        }
        .chat-avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #dff3e5, #ffffff);
            border: 1px solid rgba(31,157,85,.22);
            color: var(--green-dark);
            font-size: 14px;
            font-weight: 800;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
        }
        .chat-row.active .chat-avatar {
            background: linear-gradient(145deg, #9eea73, #e7f5eb);
            border-color: rgba(31,157,85,.42);
        }
        .chat-copy {
            min-width: 0;
            display: grid;
            gap: 4px;
        }
        .chat-name {
            min-width: 0;
            font-size: 13px;
            font-weight: 760;
            line-height: 1.25;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .chat-meta {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 18px;
            padding: 0 6px;
            margin-left: 6px;
            border-radius: 999px;
            color: #fff;
            background: var(--green);
            font-size: 10px;
            font-weight: 760;
            vertical-align: 1px;
        }
        .message-line {
            display: flex;
            margin: 7px 0;
        }
        .message-line.left {
            justify-content: flex-start;
        }
        .message-line.right {
            justify-content: flex-end;
        }
        .message-line.center {
            justify-content: center;
        }
        .message-bubble {
            max-width: min(680px, 76%);
            padding: 9px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--bubble-other);
            color: var(--ink);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            box-shadow: 0 1px 1px rgba(40, 38, 30, .04);
        }
        .message-line.right .message-bubble {
            border-color: #8ed363;
            background: var(--bubble-self);
        }
        .message-line.center .message-bubble {
            max-width: 78%;
            padding: 3px 9px;
            border: 0;
            border-radius: 999px;
            background: rgba(32,35,31,.09);
            color: var(--muted);
            font-size: 11px;
            text-align: center;
            box-shadow: none;
        }
        .empty {
            margin: 14px;
            padding: 18px;
            border: 1px dashed var(--line-strong);
            border-radius: 8px;
            color: var(--muted);
            background: rgba(255,255,255,.54);
            text-align: center;
        }
        .loading-card {
            margin: 10px 0;
            display: grid;
            gap: 12px;
        }
        .loading-row {
            display: flex;
        }
        .loading-row:nth-child(2) {
            justify-content: flex-end;
        }
        .loading-bubble {
            height: 34px;
            width: min(420px, 68%);
            border-radius: 10px;
            background: linear-gradient(90deg, rgba(255,255,255,.62), rgba(222,219,209,.72), rgba(255,255,255,.62));
            background-size: 220% 100%;
            border: 1px solid rgba(201,196,184,.6);
            animation: shimmer 1.1s ease-in-out infinite;
        }
        .loading-row:nth-child(2) .loading-bubble {
            width: min(330px, 56%);
            background: linear-gradient(90deg, rgba(158,234,115,.35), rgba(142,211,99,.54), rgba(158,234,115,.35));
            background-size: 220% 100%;
        }
        .loading-row:nth-child(3) .loading-bubble {
            width: min(520px, 78%);
        }
        .compose {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            padding: 12px;
            border-top: 1px solid var(--line);
            background: linear-gradient(180deg, #fff, var(--paper));
        }
        .compose textarea {
            width: 100%;
            min-height: 44px;
            max-height: 124px;
            resize: vertical;
            padding: 10px 12px;
            border: 1px solid var(--line-strong);
            border-radius: 8px;
            background: #fff;
            color: var(--ink);
            outline: none;
            line-height: 1.4;
        }
        .compose textarea:focus,
        .token:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(31,157,85,.14);
        }
        .token {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line-strong);
            border-radius: 8px;
            background: #fff;
            color: var(--ink);
            outline: none;
        }
        .error {
            color: var(--red);
        }
        .modal {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(32,35,31,.42);
            backdrop-filter: blur(3px);
        }
        .modal.show {
            display: flex;
        }
        .dialog {
            width: min(420px, 100%);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: 0 24px 70px rgba(32,35,31,.22);
            padding: 16px;
        }
        .dialog-title {
            font-weight: 760;
            margin-bottom: 12px;
        }
        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes statusPulse {
            50% { opacity: .45; transform: translateY(-50%) scale(.82); }
        }
        @keyframes shimmer {
            from { background-position: 120% 0; }
            to { background-position: -120% 0; }
        }
        @media (max-width: 1040px) {
            .grid {
                grid-template-columns: 316px minmax(0, 1fr);
            }
            .message-bubble {
                max-width: 84%;
            }
        }
        @media (max-width: 760px) {
            body {
                background: var(--rail);
            }
            .shell {
                height: 100dvh;
                padding: 0;
            }
            .grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .panel {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100dvh;
                border: 0;
                border-radius: 0;
                box-shadow: none;
            }
            .chat-panel {
                display: none;
            }
            body.chat-open .list-panel {
                display: none;
            }
            body.chat-open .chat-panel {
                display: flex;
            }
            .panel-head {
                min-height: 54px;
                padding: 9px 10px;
            }
            .chat-panel .panel-head {
                grid-template-columns: auto minmax(0, 1fr) auto;
            }
            .mobile-back {
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }
            .panel-actions {
                gap: 6px;
            }
            .panel-actions .status {
                display: none;
            }
            .btn {
                min-width: 64px;
                padding: 7px 10px;
            }
            .icon-btn {
                min-width: 36px;
                padding: 0;
            }
            .send-btn {
                min-width: 44px;
                width: 44px;
                padding: 0;
            }
            .send-label {
                display: none;
            }
            .list-panel .panel-body {
                padding: 6px;
            }
            .chat-panel .panel-body {
                padding: 12px 10px;
            }
            .chat-row {
                min-height: 68px;
                border-radius: 0;
                grid-template-columns: 34px minmax(0, 1fr);
            }
            .message-bubble {
                max-width: 86%;
            }
            .compose {
                grid-template-columns: minmax(0, 1fr) 44px;
                gap: 8px;
                padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
            }
            .compose textarea {
                min-height: 42px;
                max-height: 94px;
                font-size: 16px;
            }
            .token {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="grid">
            <aside class="panel list-panel">
                <div class="panel-head">
                    <div class="head-main">
                        <span class="panel-title">聊天列表</span>
                        <span class="count" id="chatCount">0</span>
                    </div>
                </div>
                <div class="panel-body" id="chatList"></div>
            </aside>

            <section class="panel chat-panel">
                <div class="panel-head">
                    <button class="btn secondary icon-btn mobile-back" id="backToList" type="button" aria-label="返回聊天列表" title="返回聊天列表">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                            <path d="m15 18-6-6 6-6"></path>
                        </svg>
                    </button>
                    <div class="head-main">
                        <span class="panel-title" id="chatTitle">聊天区域</span>
                        <span class="count" id="messageCount">0</span>
                    </div>
                    <div class="panel-actions">
                        <span class="status" id="status">等待加载主窗口状态</span>
                        <button class="btn secondary icon-btn" id="tokenBtn" type="button" aria-label="设置 Token" title="设置 Token">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                                <circle cx="7.5" cy="15.5" r="3.5"></circle>
                                <path d="M10.2 12.8 21 2"></path>
                                <path d="m15 8 2 2"></path>
                                <path d="m18 5 2 2"></path>
                            </svg>
                        </button>
                        <button class="btn icon-btn" id="refresh" type="button" aria-label="刷新" title="刷新">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                                <path d="M21 12a9 9 0 0 1-15.2 6.5"></path>
                                <path d="M3 12A9 9 0 0 1 18.2 5.5"></path>
                                <path d="M18 2v4h-4"></path>
                                <path d="M6 22v-4h4"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="panel-body" id="chatArea"></div>
                <div class="compose">
                    <textarea id="messageInput" placeholder="输入消息..."></textarea>
                    <button class="btn send-btn" id="sendText" type="button" aria-label="发送" title="发送">
                        <span class="send-label">发送</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                            <path d="m22 2-7 20-4-9-9-4Z"></path>
                            <path d="M22 2 11 13"></path>
                        </svg>
                    </button>
                </div>
            </section>
        </section>
    </main>

    <div class="modal" id="tokenModal" aria-hidden="true">
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="tokenTitle">
            <div class="dialog-title" id="tokenTitle">Bearer Token</div>
            <input class="token" id="token" type="password" placeholder="Bearer Token">
            <div class="dialog-actions">
                <button class="btn secondary" id="closeToken">取消</button>
                <button class="btn" id="saveToken">保存</button>
            </div>
        </div>
    </div>

    <script src="/console.js"></script>
</body>
</html>
