<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AWSL WeChat Bot</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#22c55e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AWSL Bot">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <script>
        (function(){var s=localStorage.getItem('bot_theme');if(!s&&matchMedia('(prefers-color-scheme:dark)').matches)s='dark';if(s)document.documentElement.setAttribute('data-theme',s)})();
    </script>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="header-left">
                <h1>AWSL WeChat Bot</h1>
                <div class="status-row"><div class="status-dot"></div><span id="statusText">加载中...</span></div>
            </div>
            <div class="header-right">
                <button class="theme-btn" onclick="toggleTheme()" title="切换主题">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
        </div>

        <div id="authSection" class="auth-bar" style="display:none">
            <span class="auth-label" id="authStatus">API Token</span>
            <div class="auth-row">
                <input type="password" id="authToken" placeholder="输入 Bearer Token...">
                <button class="btn btn-green btn-sm" onclick="saveToken()">保存</button>
                <button class="btn btn-ghost btn-sm" onclick="clearToken()">清除</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="chat">聊天</button>
            <button class="tab" data-tab="tasks">定时任务</button>
            <button class="tab" data-tab="custom-commands">自定义命令</button>
            <button class="tab" data-tab="webhooks">Webhook</button>
        </div>

        <!-- ==================== 聊天 Tab ==================== -->
        <div class="panel active" id="chat-panel">
            <div class="chat-layout">
                <div class="chat-main">
                    <div class="chat-header">
                        <div class="chat-header-left">
                            <select id="chatGroupSelect" class="chat-group-select">
                                <option value="">选择群聊...</option>
                            </select>
                            <button class="btn btn-ghost btn-sm" id="decryptBtn" style="display:none" onclick="decryptChatlog()">解密</button>
                        </div>
                        <button class="btn btn-ghost btn-sm" onclick="refreshCurrentChat()">刷新</button>
                    </div>
                    <div id="chatlogSelect" style="display:none"></div>
                    <div class="chat-pagination" id="chatPagination" style="display:none"></div>
                    <div class="messages" id="messages">
                        <div class="chat-empty" id="chatEmpty">
                            <div class="chat-empty-icon">💬</div>
                            <p>选择一个群聊开始</p>
                        </div>
                    </div>
                    <div class="chat-input" id="chatInput">
                        <div class="chat-input-row1">
                            <select id="sendWindowSelect" class="send-target-select" onchange="updateSendState()">
                                <option value="">发送到...</option>
                            </select>
                            <select id="msgType" class="msg-type-select" onchange="toggleChatMsgType()">
                                <option value="text">文本</option>
                                <option value="image">图片</option>
                                <option value="file">文件</option>
                                <option value="summary">总结</option>
                            </select>
                        </div>
                        <div class="chat-input-row2" id="chatInputRow2">
                            <div id="chatTextInput" class="chat-input-body">
                                <textarea id="msgInput" placeholder="输入消息... (Enter 发送)" rows="1"></textarea>
                            </div>
                            <div id="chatFileInput" class="chat-input-body" style="display:none">
                                <label class="file-dropzone" id="chatFileDropzone">
                                    <input type="file" id="chatFileSelect" onchange="onChatFileSelect(event)" hidden>
                                    <img id="chatFilePreview" alt="" hidden>
                                    <span id="chatFileInfo">点击选择 / 拖拽 / Ctrl+V 粘贴</span>
                                </label>
                            </div>
                            <button class="btn btn-green" id="sendMsgBtn" onclick="sendChatMessage()">发送</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== 定时任务 Tab ==================== -->
        <div class="panel" id="tasks-panel">
            <div class="panel-header">
                <div>
                    <span class="panel-title">定时任务</span>
                    <span class="panel-sub" id="timezoneInfo"></span>
                </div>
                <button class="btn btn-green btn-sm" onclick="taskCrud.showForm(); updateTargetGroupsCheckboxes();">新建任务</button>
            </div>
            <div id="tasksList"></div>
            <div id="taskFormPanel" class="form-panel" style="display:none">
                <h3 id="taskFormTitle">新建定时任务</h3>
                <form id="taskForm">
                    <input type="hidden" id="taskId">
                    <div class="form-group"><label>任务名称</label><input type="text" id="taskName" required></div>
                    <div class="form-group">
                        <label>Cron 表达式</label>
                        <input type="text" id="cronExpression" placeholder="* * * * *" required>
                        <div class="help-text">分 时 日 月 周 · 例: <code>0 9 * * *</code> = 每天9点 · <code>*/30 * * * *</code> = 每30分钟</div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>状态</label><select id="taskEnabled"><option value="true">启用</option><option value="false">禁用</option></select></div>
                        <div class="form-group"><label>任务类型</label><select id="taskType" onchange="toggleTaskFormMode()"><option value="send">发送消息</option><option value="summary">群聊总结</option></select></div>
                    </div>
                    <div class="form-group" id="taskMessageTypeGroup"><label>消息类型</label><select id="taskMessageType" onchange="toggleTaskMessageType()"><option value="text">文本</option><option value="image">图片</option><option value="file">文件</option></select></div>
                    <div class="form-group" id="taskTextGroup"><label>消息内容</label><textarea id="taskMessage" rows="3"></textarea></div>
                    <div class="form-group" id="taskImageGroup" style="display:none"><label>图片</label><input type="file" accept="image/*" onchange="previewTaskImage(event)"><div id="taskImagePreview" style="display:none"><img id="taskImagePreviewImg" style="max-width:200px;max-height:120px;border-radius:4px;margin-top:8px"></div></div>
                    <div class="form-group" id="taskFileGroup" style="display:none"><label>文件</label><input type="file" onchange="previewTaskFile(event)"><div id="taskFilePreview" style="display:none"><span id="taskFileName"></span></div></div>
                    <div class="form-group" id="taskSummaryGroup" style="display:none">
                        <label>总结配置</label>
                        <div id="summaryRows"></div>
                        <button type="button" class="btn btn-ghost btn-sm" onclick="addSummaryRow()">+ 添加群聊</button>
                    </div>
                    <div class="form-group" id="taskTargetGroupsGroup"><label>目标群组（空=全部）</label><div id="targetGroupsCheckboxes" class="checkbox-group"></div></div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-green" id="taskFormBtn">创建任务</button>
                        <button type="button" class="btn btn-ghost" onclick="taskCrud.hideForm()">取消</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ==================== 自定义命令 Tab ==================== -->
        <div class="panel" id="custom-commands-panel">
            <div class="panel-header">
                <span class="panel-title">自定义命令</span>
                <button class="btn btn-green btn-sm" onclick="customCommandCrud.showForm(); updateCustomCommandTargetGroupsCheckboxes();">新建命令</button>
            </div>
            <div id="customCommandsList"></div>
            <div id="customCommandFormPanel" class="form-panel" style="display:none">
                <h3 id="customCommandFormTitle">新建自定义命令</h3>
                <form id="customCommandForm">
                    <input type="hidden" id="customCommandId">
                    <div class="form-row">
                        <div class="form-group"><label>命令 Key</label><input type="text" id="customCommandKey" placeholder="menu" required></div>
                        <div class="form-group"><label>状态</label><select id="customCommandEnabled"><option value="true">启用</option><option value="false">禁用</option></select></div>
                    </div>
                    <div class="form-group"><label>描述</label><input type="text" id="customCommandDescription" placeholder="menu - 查看菜单"></div>
                    <div class="form-group"><label>消息类型</label><select id="customCommandMessageType" onchange="toggleCustomCommandMessageType()"><option value="text">文本</option><option value="image">图片</option><option value="file">文件</option></select></div>
                    <div class="form-group" id="customCommandTextGroup"><label>回复内容</label><textarea id="customCommandMessage" rows="3"></textarea></div>
                    <div class="form-group" id="customCommandImageGroup" style="display:none"><label>图片</label><input type="file" accept="image/*" onchange="previewCustomCommandImage(event)"><div id="customCommandImagePreview" style="display:none"><img id="customCommandImagePreviewImg" style="max-width:200px;max-height:120px;border-radius:4px;margin-top:8px"></div></div>
                    <div class="form-group" id="customCommandFileGroup" style="display:none"><label>文件</label><input type="file" onchange="previewCustomCommandFile(event)"><div id="customCommandFilePreview" style="display:none"><span id="customCommandFileName"></span></div></div>
                    <div class="form-group"><label>目标群组（空=全部）</label><div id="customCommandTargetGroupsCheckboxes" class="checkbox-group"></div></div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-green" id="customCommandFormBtn">创建命令</button>
                        <button type="button" class="btn btn-ghost" onclick="customCommandCrud.hideForm()">取消</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ==================== Webhook Tab ==================== -->
        <div class="panel" id="webhooks-panel">
            <div class="panel-header">
                <span class="panel-title">Webhook</span>
                <button class="btn btn-green btn-sm" onclick="webhookCrud.showForm()">新建 Webhook</button>
            </div>
            <div id="webhooksList"></div>
            <div id="webhookFormPanel" class="form-panel" style="display:none">
                <h3 id="webhookFormTitle">新建 Webhook</h3>
                <form id="webhookForm">
                    <input type="hidden" id="webhookId">
                    <div class="form-group"><label>名称</label><input type="text" id="webhookName" required></div>
                    <div class="form-group"><label>URL</label><input type="url" id="webhookUrl" required></div>
                    <div class="form-row">
                        <div class="form-group"><label>群聊过滤 (正则)</label><input type="text" id="webhookGroupFilter" placeholder="空=全部"></div>
                        <div class="form-group"><label>消息过滤 (正则)</label><input type="text" id="webhookMessageFilter" placeholder="空=全部"></div>
                    </div>
                    <div class="form-group"><label>Headers (JSON)</label><textarea id="webhookHeaders" rows="2" style="font-family:monospace">{}</textarea></div>
                    <div class="form-group">
                        <label>Body 模板 (JSON)</label>
                        <textarea id="webhookBodyTemplate" rows="3" style="font-family:monospace">{}</textarea>
                        <div class="help-text">占位符: <code>{{group_name}}</code> 群名 · <code>{{message}}</code> 消息原文</div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>状态</label><select id="webhookEnabled"><option value="true">启用</option><option value="false">禁用</option></select></div>
                        <div class="form-group"><label>回复模式</label><select id="webhookReplyMode" onchange="toggleReplyJsonPath()"><option value="none">不回复</option><option value="text">纯文本</option><option value="jsonpath">JSONPath</option></select></div>
                    </div>
                    <div class="form-group" id="replyJsonPathGroup" style="display:none"><label>JSONPath 表达式</label><input type="text" id="webhookReplyJsonPath" placeholder="$.data.reply"></div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-green" id="webhookFormBtn">创建 Webhook</button>
                        <button type="button" class="btn btn-ghost" onclick="webhookCrud.hideForm()">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/app.js"></script>
    <script src="/chat.js"></script>
    <script src="/tasks.js"></script>
    <script src="/custom_commands.js"></script>
    <script src="/webhooks.js"></script>
</body>
</html>
