<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWSL Console</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f5f1;
            --panel: #ffffff;
            --panel-2: #f0eee8;
            --text: #20231f;
            --muted: #6b7068;
            --line: #d9d5cb;
            --green: #168a53;
            --green-2: #e6f4ed;
            --red: #b42318;
            --shadow: 0 16px 48px rgba(42, 38, 28, .08);
        }

        * { box-sizing: border-box; }
        html,
        body {
            height: 100%;
            overflow: hidden;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        }
        button, input, textarea {
            font: inherit;
        }
        .shell {
            height: 100vh;
            padding: 20px;
            display: grid;
            grid-template-rows: minmax(0, 1fr);
            overflow: hidden;
        }
        .status {
            color: var(--muted);
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .panel-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }
        .mobile-back {
            display: none;
        }
        .token {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--line);
            background: var(--panel-2);
            color: var(--text);
            outline: none;
        }
        .token:focus {
            border-color: var(--green);
        }
        .btn {
            border: 1px solid #0f6f41;
            background: var(--green);
            color: white;
            padding: 9px 12px;
            cursor: pointer;
            min-width: 84px;
        }
        .btn.secondary {
            border-color: var(--line);
            background: var(--panel);
            color: var(--text);
        }
        .btn:disabled {
            cursor: not-allowed;
            opacity: .6;
        }
        .grid {
            display: grid;
            grid-template-columns: 380px minmax(0, 1fr);
            gap: 16px;
            height: 100%;
            min-height: 0;
        }
        .panel {
            min-height: 0;
            background: var(--panel);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }
        .panel-head {
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            min-height: 54px;
        }
        .panel-title {
            font-weight: 700;
        }
        .count {
            color: var(--muted);
            font-size: 12px;
            justify-self: start;
        }
        .panel-body {
            min-height: 0;
            overflow: auto;
            padding: 12px;
        }
        .chat-row {
            width: 100%;
            text-align: left;
            padding: 10px;
            border: 1px solid var(--line);
            background: #fbfaf7;
            margin-bottom: 8px;
            color: var(--text);
            cursor: pointer;
        }
        .chat-row:hover,
        .chat-row.active {
            border-color: var(--green);
            background: var(--green-2);
        }
        .chat-name {
            font-weight: 700;
            overflow-wrap: anywhere;
        }
        .chat-meta {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
            overflow-wrap: anywhere;
        }
        .badge {
            display: inline-block;
            min-width: 22px;
            padding: 1px 6px;
            margin-left: 6px;
            color: #0f6f41;
            background: var(--green-2);
            border: 1px solid #b7dfc9;
            text-align: center;
        }
        .message {
            padding: 10px 12px;
            margin-bottom: 8px;
            border-left: 3px solid var(--green);
            background: #fbfaf7;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .message.timestamp {
            border-left-color: var(--line);
            color: var(--muted);
            text-align: center;
            background: transparent;
        }
        .empty {
            color: var(--muted);
            padding: 20px 4px;
        }
        .compose {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid var(--line);
        }
        .compose textarea {
            width: 100%;
            min-height: 42px;
            max-height: 120px;
            resize: vertical;
            padding: 9px 10px;
            border: 1px solid var(--line);
            background: var(--panel-2);
            color: var(--text);
            outline: none;
            font: inherit;
        }
        .compose textarea:focus {
            border-color: var(--green);
        }
        .error {
            color: var(--red);
        }
        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(32, 35, 31, .36);
        }
        .modal.show {
            display: flex;
        }
        .dialog {
            width: min(420px, 100%);
            background: var(--panel);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            padding: 16px;
        }
        .dialog-title {
            font-weight: 700;
            margin-bottom: 12px;
        }
        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 12px;
        }
        @media (max-width: 1180px) {
            .grid { grid-template-columns: 1fr; }
            .panel-head { grid-template-columns: auto auto; }
            .status { grid-column: 1 / -1; }
            .panel-actions { justify-content: flex-end; }
        }
        @media (max-width: 760px) {
            .shell {
                height: 100dvh;
                padding: 0;
            }
            .grid {
                gap: 0;
            }
            .panel {
                height: 100dvh;
                border: 0;
                box-shadow: none;
            }
            .chat-panel {
                display: none;
            }
            body.chat-open .list-panel {
                display: none;
            }
            body.chat-open .chat-panel {
                display: flex;
            }
            .panel-head {
                grid-template-columns: auto auto minmax(0, 1fr);
                min-height: 52px;
                padding: 10px 12px;
            }
            .chat-panel .panel-head {
                grid-template-columns: auto minmax(0, 1fr) auto;
            }
            .mobile-back {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 56px;
                padding: 8px 10px;
            }
            .chat-panel .panel-title {
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .chat-panel .count {
                justify-self: end;
            }
            .panel-actions {
                grid-column: 1 / -1;
                justify-content: stretch;
            }
            .panel-actions .status {
                flex: 1;
                grid-column: auto;
            }
            .panel-actions .btn {
                min-width: 72px;
            }
            .panel-body {
                padding: 10px;
            }
            .chat-row {
                margin-bottom: 6px;
            }
            .compose {
                grid-template-columns: minmax(0, 1fr) 72px;
                padding: 10px;
            }
            .compose textarea {
                min-height: 42px;
                max-height: 96px;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="grid">
            <aside class="panel list-panel">
                <div class="panel-head">
                    <span class="panel-title">聊天列表</span>
                    <span class="count" id="chatCount">0</span>
                    <span></span>
                </div>
                <div class="panel-body" id="chatList"></div>
            </aside>

            <section class="panel chat-panel">
                <div class="panel-head">
                    <button class="btn secondary mobile-back" id="backToList" type="button">返回</button>
                    <span class="panel-title">聊天区域</span>
                    <span class="count" id="messageCount">0</span>
                    <div class="panel-actions">
                        <span class="status" id="status">等待加载主窗口状态</span>
                        <button class="btn secondary" id="tokenBtn">Token</button>
                        <button class="btn" id="refresh">刷新</button>
                    </div>
                </div>
                <div class="panel-body" id="chatArea"></div>
                <div class="compose">
                    <textarea id="messageInput" placeholder="输入消息..."></textarea>
                    <button class="btn" id="sendText">发送</button>
                </div>
            </section>
        </section>
    </main>

    <div class="modal" id="tokenModal" aria-hidden="true">
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="tokenTitle">
            <div class="dialog-title" id="tokenTitle">Bearer Token</div>
            <input class="token" id="token" type="password" placeholder="Bearer Token">
            <div class="dialog-actions">
                <button class="btn secondary" id="closeToken">取消</button>
                <button class="btn" id="saveToken">保存</button>
            </div>
        </div>
    </div>

    <script src="/console.js"></script>
</body>
</html>
