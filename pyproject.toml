[project]
name = "awsl-wechat-bot"
version = "0.1.0"
description = "跨平台微信群聊机器人 - Gateway + Cortex 微服务架构"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlmodel>=0.0.16",
    "croniter>=2.0.0",
    # macOS
    "pyobjc-framework-Vision>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=9.0; sys_platform == 'darwin'",
    # Windows
    "uiautomation>=2.0.0; sys_platform == 'win32'",
    "pywin32>=305; sys_platform == 'win32'",
    "Pillow>=9.0.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
decrypt = [
    "pycryptodome>=3.19.0",
    "zstandard>=0.22.0",
]
summary = [
    "html2image>=2.0.0",
    "Pillow>=9.0.0",
    "markdown>=3.4.0",
]
