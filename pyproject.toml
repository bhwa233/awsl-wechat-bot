[project]
name = "awsl-wechat-bot"
version = "0.1.0"
description = "跨平台微信群聊机器人 - Gateway + Cortex 微服务架构"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "fastapi>=0.161.1",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlmodel>=0.0.48",
    "croniter>=6.2.4",
    # macOS
    "pyobjc-framework-Vision>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=12.2.2; sys_platform == 'darwin'",
    # Windows
    "uiautomation>=2.0.29; sys_platform == 'win32'",
    "pywin32>=312; sys_platform == 'win32'",
    "Pillow>=13.0.0; sys_platform == 'win32'",
    "edge-tts>=7.3.1; sys_platform == 'win32' or sys_platform == 'linux'",
    "sounddevice>=0.5.6; sys_platform == 'win32'",
    # 解密 + 总结
    "pycryptodome>=4.1.0",
    "zstandard>=0.25.0",
    "html2image>=2.0.7",
    "Pillow>=13.0.0",
    "markdown>=3.11.2",
    "jsonpath-ng>=1.13.0",
    # wxgf (HEVC) -> JPEG, SILK voice -> MP3: 微信 4.x 富媒体解码;
    # av 自带 ffmpeg (用于 HEVC/MP3), pilk 提供 SILK v3 -> PCM
    "av>=18.1.0",
    "pilk>=0.2.4",
    "numpy>=2.4.6",
    "psutil>=7.2.2",
    "prometheus-client>=0.26.0",
    "jeepney>=0.9.0 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = [
    ".claude",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors，含 E402 顶部导入检查
    "F",    # Pyflakes / Flake8 核心错误
    "W",    # pycodestyle warnings
    "I",    # isort 导入排序
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # Ruff 专属规则
]
[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = [
    "chatlog",
    "common",
    "cortex",
    "daemon",
    "gateway",
    "tools",
]
