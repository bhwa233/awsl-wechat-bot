[project]
name = "awsl-wechat-bot"
version = "0.1.0"
description = "跨平台微信群聊机器人 - Gateway + Cortex 微服务架构"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlmodel>=0.0.16",
    "croniter>=2.0.0",
    # macOS
    "pyobjc-framework-Vision>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=9.0; sys_platform == 'darwin'",
    # Windows
    "uiautomation>=2.0.0; sys_platform == 'win32'",
    "pywin32>=305; sys_platform == 'win32'",
    "Pillow>=9.0.0; sys_platform == 'win32'",
    "edge-tts>=7.2.8; sys_platform == 'win32'",
    "sounddevice>=0.5.2; sys_platform == 'win32'",
    # 解密 + 总结
    "pycryptodome>=3.19.0",
    "zstandard>=0.22.0",
    "html2image>=2.0.0",
    "Pillow>=9.0.0",
    "markdown>=3.4.0",
    "jsonpath-ng>=1.8.0",
    # wxgf (HEVC) -> JPEG, SILK voice -> MP3: 微信 4.x 富媒体解码;
    # av 自带 ffmpeg (用于 HEVC/MP3), pilk 提供 SILK v3 -> PCM
    "av>=12.0.0",
    "pilk>=0.2.0",
    "numpy>=1.24.0",
    "psutil>=7.2.2",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = [
    ".claude",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors，含 E402 顶部导入检查
    "F",    # Pyflakes / Flake8 核心错误
    "W",    # pycodestyle warnings
    "I",    # isort 导入排序
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # Ruff 专属规则
]
[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = [
    "chatlog",
    "common",
    "cortex",
    "daemon",
    "gateway",
    "tools",
]
